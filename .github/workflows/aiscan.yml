name: AI Code Copyright Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  aicopycheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run AI code scanner
        run: npx aicopycheck --json --output aicopycheck-report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: aicopycheck-report
          path: aicopycheck-report.json
      - name: Check risk level
        run: |
          RISK=$(node -e "const r=require('./aicopycheck-report.json'); console.log(r.projectRisk)")
          if [ "$RISK" = "critical" ] || [ "$RISK" = "high" ]; then
            echo "::warning::AI code risk level: $RISK - review before merge"
          fi
